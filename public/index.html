<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>持仓云图</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 顶部悬浮信息条 -->
  <div id="overlay-bar">
    <span id="total-value" class="overlay-total summary-toggle" role="button" tabindex="0" aria-pressed="false" title="隐藏总仓位和总收益">--</span>
    <span id="today-pnl" class="overlay-pnl summary-toggle" role="button" tabindex="0" aria-pressed="false" title="隐藏总仓位和总收益">--</span>
    <span id="market-turnover" class="overlay-market">两市成交 --<span id="market-turnover-yoy" class="overlay-market-yoy"></span></span>
    <span id="polysilicon-price" class="overlay-poly">--</span>
    <span id="data-status" class="overlay-status"></span>
    <span id="update-time" class="overlay-time"></span>
  </div>

  <!-- 全屏 Treemap -->
  <main id="main">
    <section id="stock-section" class="treemap-section">
      <div class="section-label">
        <span class="section-icon">🪙</span> 股票
        <span id="stock-count" class="count-badge">0</span>
        <a class="section-action" href="/import.html">导入</a>
      </div>
      <div id="stock-treemap" class="treemap-container stock-area"></div>
    </section>
    <section id="fund-section" class="treemap-section">
      <div class="section-label">
        <span class="section-icon">📈</span> 基金
        <span id="fund-count" class="count-badge">0</span>
      </div>
      <div id="fund-treemap" class="treemap-container fund-area"></div>
    </section>
    <section id="watchlist-section">
      <div class="section-label">
        观察仓
        <span id="watchlist-count" class="count-badge">0/10</span>
      </div>
      <div id="watchlist-grid" class="watchlist-grid"></div>
    </section>
  </main>

  <div id="tooltip" class="tooltip hidden">
    <div class="tooltip-header">
      <span class="tooltip-name"></span>
      <span class="tooltip-code"></span>
    </div>
    <div class="tooltip-body">
      <div class="tooltip-row"><span class="tooltip-label">市值</span><span class="tooltip-value tooltip-mv"></span></div>
      <div class="tooltip-row"><span class="tooltip-label">日涨跌</span><span class="tooltip-value tooltip-dc"></span></div>
      <div class="tooltip-row"><span class="tooltip-label">今日盈亏</span><span class="tooltip-value tooltip-tp"></span></div>
      <div class="tooltip-row"><span class="tooltip-label">持仓盈亏</span><span class="tooltip-value tooltip-hp"></span></div>
      <div class="tooltip-row"><span class="tooltip-label">收益率</span><span class="tooltip-value tooltip-hr"></span></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
